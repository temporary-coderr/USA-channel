name: Build WISE LAB video from script

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - shorts

permissions:
  contents: write

concurrency:
  group: usa-channel-script-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
      INWORLD_VOICE_ID: Dennis
      INWORLD_LANGUAGE: en-US
      VIDEO_FORMAT: ${{ inputs.format }}
      SCRIPT_FILE: scripts/script.txt
      TARGET_WPM: "140"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check script and API secrets
        run: |
          test -s scripts/script.txt || (echo "Upload your script to scripts/script.txt first." && exit 1)
          test -n "$GROQ_API_KEY" || (echo "Missing GROQ_API_KEY repository secret." && exit 1)
          test -n "$PIXABAY_API_KEY" || (echo "Missing PIXABAY_API_KEY repository secret." && exit 1)
          test -n "$INWORLD_API_KEY" || (echo "Missing INWORLD_API_KEY repository secret. Add it in repository Settings > Secrets and variables > Actions." && exit 1)

      - name: Create edited WISE LAB video
        run: python render_script.py

      - name: Save visual usage history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual_history/used_assets.json
          if git diff --cached --quiet; then
            echo "Visual history has no changes."
          else
            git commit -m "Update WISE LAB visual usage history"
            git push
          fi

      - name: Upload WISE LAB video, logo and captions
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-video-${{ github.run_number }}
          # Upload only the finished video and useful deliverables.
          # Exclude output/work/ and large intermediate renders/source footage.
          path: |
            output/wise_lab_*.mp4
            output/captions.srt
            output/wise_lab_voiceover.mp3
            output/title.txt
            output/voiceover_script.txt
            output/scene_plan.json
            output/wise_lab_logo.svg
          if-no-files-found: error
          retention-days: 7
