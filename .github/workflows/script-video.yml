name: Build WISE LAB video from script

on:
  push:
    paths:
      - "scripts/script.txt"
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - shorts

permissions:
  contents: write

concurrency:
  group: usa-channel-script-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
      OPENAI_IMAGE_QUALITY: medium
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_IMAGES_PER_VIDEO: "6"
      WISE_LAB_TARGET_MARKET: US
      WISE_LAB_CONTENT_LANGUAGE: en-US
      WISE_LAB_VISUAL_UNIQUENESS: strict
      EDGE_TTS_VOICE: en-US-AndrewNeural
      EDGE_TTS_RATE: "+5%"
      VIDEO_FORMAT: ${{ inputs.format || 'landscape' }}
      SCRIPT_FILE: scripts/script.txt
      TARGET_WPM: "140"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: private
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check and install FFmpeg only if missing
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is not preinstalled; installing it now."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            echo "FFmpeg is already available on this GitHub runner; skipping apt downloads."
          fi

          if ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            echo "DejaVu fonts are missing; installing them now."
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          else
            echo "DejaVu Sans font is already available."
          fi

          ffmpeg -version | head -n 1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax before rendering
        run: python -m py_compile editorial_gate.py render_script.py visual_uniqueness.py quality_check.py upload_youtube.py

      - name: Check script and API secrets
        run: |
          test -s scripts/script.txt || (echo "Upload your script to scripts/script.txt first." && exit 1)
          test -n "$PIXABAY_API_KEY" || (echo "Missing PIXABAY_API_KEY repository secret." && exit 1)
          echo "Voice: Edge-TTS en-US-AndrewNeural; unchanged and independent of image generation."
          if [ -n "$OPENAI_API_KEY" ]; then echo "OpenAI GPT Image generation: enabled (target 6 images, max 7)."; else echo "OpenAI image generation: skipped (optional OPENAI_API_KEY not set)."; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "Groq prompt refinement: enabled (optional)."; else echo "Groq prompt refinement: local prompt fallback."; fi

      - name: Run originality and editorial checks
        run: python editorial_gate.py

      - name: Create edited WISE LAB video
        run: python render_script.py

      - name: Run technical quality checks and prepare human review pack
        run: python quality_check.py

      # Save the finished render and review reports before attempting YouTube upload.
      # This preserves a downloadable MP4 even if OAuth or YouTube is temporarily unavailable.
      - name: Upload WISE LAB video, logo and captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-video-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            output/wise_lab_*.mp4
            output/captions.srt
            output/captions.ass
            output/wise_lab_voiceover.mp3
            output/title.txt
            output/voiceover_script.txt
            output/scene_plan.json
            output/visual_manifest.json
            visual_policy.json
            visual_history/used_assets.json
            output/description.txt
            output/background_music_credit.txt
            output/editorial_review.txt
            output/editorial_gate.txt
            output/editorial_gate.json
            output/technical_quality.txt
            output/technical_quality.json
            output/review_checklist.md
            scripts/research_notes.md
            output/wise_lab_logo.svg
            output/work/wise_lab_character/*.svg
            output/work/wise_lab_character/*.png
            output/wise_lab_thumbnail.jpg
            output/youtube_video_url.txt
          retention-days: 7

      - name: Upload video to YouTube (private)
        run: python upload_youtube.py
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
          VIDEO_FORMAT: ${{ inputs.format || 'landscape' }}

      - name: Save private YouTube review link
        if: always() && hashFiles('output/youtube_video_url.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-private-review-link-${{ github.run_number }}
          path: |
            output/youtube_video_url.txt
            output/review_checklist.md
          if-no-files-found: warn
          retention-days: 7

      - name: Save visual usage history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A visual_history/
          if git diff --cached --quiet; then
            echo "Visual and music history have no changes."
          else
            git commit -m "Update WISE LAB visual and music usage history"
            # A script update or another workflow may have advanced main while this
            # render was running. Rebase this history-only commit before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "WARNING: Could not safely rebase visual history; leaving the remote branch untouched."
                exit 0
              fi
              if git push origin HEAD:main; then
                echo "Visual usage history pushed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after fetching main."
              sleep 2
            done
            echo "WARNING: Visual history could not be pushed after 3 attempts; video output remains available."
            exit 0
          fi
