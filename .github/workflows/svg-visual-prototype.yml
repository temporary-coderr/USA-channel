name: WISE LAB SVG visual prototype

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Preview format"
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - shorts

permissions:
  contents: read

concurrency:
  group: wise-lab-svg-prototype
  cancel-in-progress: false

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SVG renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install CairoSVG Pillow

      - name: Validate engine
        run: python -m py_compile svg_animation_engine.py

      - name: Run SVG engine tests
        run: python -m unittest discover -s tests -p 'test_svg_animation_engine.py' -v

      - name: Validate animated renderer
        run: python -m py_compile svg_video_renderer.py

      - name: Run animation and sound tests
        run: python -m unittest discover -s tests -p 'test_svg_video_renderer.py' -v

      - name: Render animated MP4 with original sound effects
        run: |
          python svg_video_renderer.py \
            --script scripts/script.txt \
            --output output/svg_animation_preview \
            --format "${{ inputs.format }}" \
            --wpm 140 \
            --seconds 3 \
            --fps 12 \
            --width 720

      - name: Upload animated video review pack
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-animated-preview-${{ github.run_number }}
          if-no-files-found: error
          path: |
            output/svg_animation_preview/wise_lab_animated_preview.mp4
            output/svg_animation_preview/sound_effects.wav
            output/svg_animation_preview/animation_manifest.json
            output/svg_animation_preview/scene_svgs/
          retention-days: 7
